services:
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: playback-minio
    hostname: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - playback-network

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: playback-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing myminio/flink-checkpoints;
        mc mb --ignore-existing myminio/flink-savepoints;
        mc mb --ignore-existing myminio/flink-ha;
        echo 'Buckets created:';
        mc ls myminio;
      "
    networks:
      - playback-network

volumes:
  minio-data:
