# Master docker-compose - imports all modular services
# Usage: docker-compose up -d
#
# Prerequisites:
#   1. Build Flink JARs: ./gradlew :flink-jobs:shadowJar
#   2. Build Flink images: docker-compose -f flink/docker-compose.yml build

name: playback-platform

include:
  # Core infrastructure
  - kafka/docker-compose.yml
  - schema-registry/docker-compose.yml
  - cassandra/docker-compose.yml

  # Flink - 3 independent jobs (Application Mode)
  - flink/docker-compose.yml

  # Production infrastructure
  - minio/docker-compose.yml       # S3-compatible checkpoint storage
  - zookeeper/docker-compose.yml   # High Availability coordination

  # Observability
  - monitoring/docker-compose.yml

networks:
  playback-network:
    driver: bridge
