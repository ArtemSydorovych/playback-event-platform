# Monitoring Stack - Prometheus + Grafana
#
# Provides full observability for Netflix-style Flink deployment:
# - Prometheus for metrics collection
# - Grafana for dashboards and alerting
#
# Scrapes metrics from:
# - Raw Events Job (9249)
# - Content Metrics Job (9250)
# - Session Detection Job (9251)
# - Kafka (9308)
# - Cassandra (9500)

services:
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: playback-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - playback-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: playback-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - playback-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
    name: playback-prometheus-data
  grafana-data:
    name: playback-grafana-data
