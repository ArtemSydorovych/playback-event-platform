# Base docker-compose - infrastructure only, no Flink
# Use this as the base for production mode:
#   docker-compose -f docker-compose.base.yml -f flink/docker-compose.production.yml up -d

name: playback-platform

include:
  # Core infrastructure
  - kafka/docker-compose.yml
  - schema-registry/docker-compose.yml
  - cassandra/docker-compose.yml

  # Netflix-style infrastructure
  - minio/docker-compose.yml       # S3-compatible checkpoint storage
  - zookeeper/docker-compose.yml   # High Availability coordination

  # Observability
  - monitoring/docker-compose.yml

networks:
  playback-network:
    driver: bridge
