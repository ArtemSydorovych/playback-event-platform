# Application Mode deployment (Production-style)
# Usage:
#   1. Build: ./gradlew :flink-jobs:shadowJar
#   2. Build image: docker build -t playback-flink-job -f docker/flink/Dockerfile .
#   3. Run: docker-compose -f docker/flink/docker-compose.app-mode.yml up

services:
  flink-job:
    build:
      context: ../..
      dockerfile: docker/flink/Dockerfile
    image: playback-flink-job:latest
    container_name: playback-flink-job
    command: standalone-job --job-classname com.artemsydorovych.playback.flink.PlaybackPipelineJob
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-job
        state.backend: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 60000

      # Application config
      FLINK_KAFKA_BOOTSTRAP_SERVERS: "playback-kafka:29092"
      FLINK_KAFKA_TOPIC: "playback-events"
      FLINK_KAFKA_GROUP_ID: "flink-playback-consumer"
      FLINK_SCHEMA_REGISTRY_URL: "http://playback-schema-registry:8081"
      FLINK_CASSANDRA_CONTACT_POINTS: "playback-cassandra"
      FLINK_CASSANDRA_PORT: "9042"
      FLINK_CASSANDRA_DATACENTER: "datacenter1"
      FLINK_CASSANDRA_KEYSPACE: "playback"
    ports:
      - "8083:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - playback-network

  flink-taskmanager:
    image: playback-flink-job:latest
    container_name: playback-flink-taskmanager-app
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-job
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2g
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - playback-network
    depends_on:
      - flink-job

volumes:
  flink-checkpoints:
