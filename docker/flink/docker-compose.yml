services:
  flink-jobmanager:
    image: flink:1.18-java17
    container_name: playback-flink-jobmanager
    hostname: jobmanager
    ports:
      - "8083:8081"
    command: jobmanager
    environment:
      # Flink cluster configuration
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.backend: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        web.upload.dir: /opt/flink/usrlib
        taskmanager.numberOfTaskSlots: 6

      # Application configuration (injected into job via env vars)
      FLINK_KAFKA_BOOTSTRAP_SERVERS: "playback-kafka:29092"
      FLINK_KAFKA_TOPIC: "playback-events"
      FLINK_KAFKA_GROUP_ID: "flink-playback-consumer"
      FLINK_SCHEMA_REGISTRY_URL: "http://playback-schema-registry:8081"
      FLINK_CASSANDRA_CONTACT_POINTS: "playback-cassandra"
      FLINK_CASSANDRA_PORT: "9042"
      FLINK_CASSANDRA_DATACENTER: "datacenter1"
      FLINK_CASSANDRA_KEYSPACE: "playback"
      FLINK_PARALLELISM: "4"
      FLINK_SINK_PARALLELISM: "2"
    networks:
      - playback-network
    depends_on:
      - flink-taskmanager

  flink-taskmanager:
    image: flink:1.18-java17
    container_name: playback-flink-taskmanager
    hostname: taskmanager
    command: taskmanager
    environment:
      # Flink cluster configuration
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 6
        taskmanager.memory.process.size: 2g
        state.backend: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///tmp/flink-checkpoints

      # Application configuration (same as jobmanager for consistency)
      FLINK_KAFKA_BOOTSTRAP_SERVERS: "playback-kafka:29092"
      FLINK_SCHEMA_REGISTRY_URL: "http://playback-schema-registry:8081"
      FLINK_CASSANDRA_CONTACT_POINTS: "playback-cassandra"
      FLINK_CASSANDRA_PORT: "9042"
      FLINK_CASSANDRA_KEYSPACE: "playback"
    networks:
      - playback-network
