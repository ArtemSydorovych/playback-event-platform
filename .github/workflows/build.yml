# Build and Push Flink Job Images
#
# Triggers: Push to main/master, Pull Requests
# Artifacts: Docker images pushed to GitHub Container Registry (ghcr.io)
#
# Images built:
#   - ghcr.io/{owner}/playback-raw-events
#   - ghcr.io/{owner}/playback-content-metrics
#   - ghcr.io/{owner}/playback-session-detection

name: Build and Push

on:
  push:
    branches: [main, master]
    paths:
      - 'flink-jobs/**'
      - 'avro-schemas/**'
      - 'docker/flink/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'flink-jobs/**'
      - 'avro-schemas/**'
      - 'docker/flink/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/playback

jobs:
  # =============================================================
  # BUILD JAR
  # =============================================================
  build-jar:
    name: Build Flink Jobs JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :flink-jobs:shadowJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: flink-jobs-jar
          path: flink-jobs/build/libs/playback-flink-jobs-all.jar
          retention-days: 1

  # =============================================================
  # BUILD DOCKER IMAGES
  # =============================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-jar

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        job:
          - name: raw-events
            dockerfile: docker/flink/Dockerfile.raw-events
          - name: content-metrics
            dockerfile: docker/flink/Dockerfile.content-metrics
          - name: session-detection
            dockerfile: docker/flink/Dockerfile.session-detection

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: flink-jobs-jar
          path: flink-jobs/build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.job.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.job.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================
  # SUMMARY
  # =============================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-jar, build-images]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-jar.result }}" == "failure" ] || [ "${{ needs.build-images.result }}" == "failure" ]; then
            echo "Build failed!"
            exit 1
          fi
          echo "Build completed successfully!"
          echo ""
          echo "Images pushed to:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-raw-events"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-content-metrics"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-session-detection"
